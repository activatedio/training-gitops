# Exposes the ArgoCD UI through ingress-nginx via SSL passthrough (argocd-server
# keeps serving its own TLS — no server.insecure needed). Copied into the gitops
# repo's cluster-resources/in-cluster/ by 05-enable-ingress.sh; the
# cluster-resources ApplicationSet syncs it into the argocd namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
