# Umbrella chart: it vendors nothing — it just declares a dependency on the
# podinfo chart in its public Helm repository. ArgoCD (and Helm) resolve and
# pull the dependency at render time using Chart.lock.
apiVersion: v2
name: podinfo
description: Pulls podinfo from its Helm repository (nothing vendored here)
type: application
version: 0.1.0
dependencies:
  - name: podinfo
    version: 6.14.0
    repository: https://stefanprodan.github.io/podinfo
