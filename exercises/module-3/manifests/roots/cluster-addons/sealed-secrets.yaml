# sealed-secrets cluster add-on (Module 3 demo). Copy into your gitops repo at
# roots/cluster-addons/sealed-secrets.yaml; the cluster-addons-root applies it.
# A clusters-generator ApplicationSet installs the sealed-secrets controller on
# every connected cluster, in the cluster-addons project.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'sealed-secrets-{{name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-addons
      source:
        repoURL: https://bitnami.github.io/sealed-secrets
        chart: sealed-secrets
        targetRevision: 2.17.4
        helm:
          releaseName: sealed-secrets
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
