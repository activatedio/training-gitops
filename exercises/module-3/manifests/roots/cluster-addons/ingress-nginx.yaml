# ingress-nginx cluster add-on (live version copied in by 05-enable-ingress.sh).
# A clusters-generator ApplicationSet, in the cluster-addons project, installing
# the ingress-nginx Helm chart with kind-tuned values. On a real cluster you'd
# use controller.service.type: LoadBalancer instead of hostPort.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'ingress-nginx-{{name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-addons
      source:
        repoURL: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        targetRevision: 4.12.1
        helm:
          releaseName: ingress-nginx
          valuesObject:
            controller:
              hostPort:
                enabled: true
              service:
                type: ClusterIP
              nodeSelector:
                ingress-ready: "true"
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Equal
                  effect: NoSchedule
              extraArgs:
                enable-ssl-passthrough: "true"
              admissionWebhooks:
                enabled: false
      destination:
        server: '{{server}}'
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
