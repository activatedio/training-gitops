# ingress-nginx cluster add-on (Module 3 demo), per-cluster opt-in.
#
# Unlike sealed-secrets (a `clusters` generator that installs everywhere), this
# uses a git *files* generator: it only creates an Application for clusters that
# have a cluster-configs/<cluster>/ingress-nginx.yaml opt-in file. The directory
# name is the cluster's ArgoCD name and becomes destination.name.
#
# __GIT_REPO_URL__ is substituted with your gitops repo by 03-install-ingress.sh.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: __GIT_REPO_URL__
        revision: HEAD
        files:
          - path: roots/cluster-addons/cluster-configs/*/ingress-nginx.yaml
  template:
    metadata:
      name: 'ingress-nginx-{{.path.basename}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-addons
      source:
        repoURL: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        targetRevision: '{{.chartVersion}}'
        helm:
          releaseName: ingress-nginx
          values: |
            {{- toYaml .values | nindent 12 }}
      destination:
        name: '{{.path.basename}}'
        namespace: ingress-nginx
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
