# Opt-in config: install ingress-nginx on the "in-cluster" cluster (ArgoCD's name
# for the cluster it runs on). The ingress-nginx ApplicationSet's git generator
# reads this file; chartVersion + values flow into the generated Application.
# kind-tuned values: bind node 80/443, pin to the ingress-ready control-plane
# node, and enable ssl-passthrough for the ArgoCD UI Ingress.
chartVersion: 4.12.1
values:
  controller:
    hostPort:
      enabled: true
    service:
      type: ClusterIP
    nodeSelector:
      ingress-ready: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
    extraArgs:
      enable-ssl-passthrough: "true"
    admissionWebhooks:
      enabled: false
